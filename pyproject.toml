[project]
name = "outreach-agent"
version = "0.1.0"
description = "Supervisor-routed LangGraph agent that finds, qualifies and drafts outreach to local roofing companies (test inbox only)."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "langgraph>=1.2.21",
    "langgraph-checkpoint-sqlite>=3.1.3",
    "langchain-anthropic>=1.7.10",
    "langsmith>=0.14",
    "exa-py>=2.28",
    "httpx>=0.27",
    "tenacity>=9.0",
    "tldextract>=5.4",
    "selectolax>=0.3",
    "email-validator>=2.3",
    "phonenumbers>=9.0",
    "pydantic>=2.9",
    "typer>=0.12",
    "rich>=13.0",
    "python-dotenv>=1.0",
    "python-ulid>=3.0",
    "truststore>=0.10",
]

[project.scripts]
outreach = "outreach.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-socket>=0.7",
    "ruff>=0.8",
    "mypy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/outreach"]
artifacts = ["src/outreach/prompts/*.md", "src/outreach/db/*.sql", "src/outreach/db/memory_schema/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--disable-socket --allow-unix-socket --allow-hosts=127.0.0.1,::1"
markers = ["live: hits real vendor APIs; opt in with OUTREACH_LIVE=1"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.12"
packages = ["outreach"]
mypy_path = "src"
ignore_missing_imports = true
warn_unused_ignores = true
